[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-satellite-search"
version = "0.1.0"
description = "Offline semantic retrieval and multi-temporal change analysis of satellite imagery"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
